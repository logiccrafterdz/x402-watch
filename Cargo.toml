[package]
name = "x402-watch"
version = "0.1.0"
edition = "2021"

[dependencies]
# "x402-rs" = { version = "0.12", default-features = false }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.13"
chrono = "0.4"
dotenv = "0.15"
ethers = { version = "2.0", features = ["rustls", "ws", "abigen"] }
getrandom = "0.2"
hex = "0.4"
